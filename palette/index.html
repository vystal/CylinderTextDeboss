    if (mode === "smooth") text += " The new surface sits in the body, so hide the body to see it.";
    if (mode === "exact") text += " It's one group in the timeline.";
    if (reply.warning) text += "\n" + reply.warning;
    say(text);
  } finally {
    button.disabled = false;
  }
}

// ===========================================================================
// Wiring
// ===========================================================================

$("pick").onclick = async () => {
  if (!inFusion()) return say("Not running inside Fusion.", true);
  say("Select a cylindrical face or body in the canvas…");
  const reply = JSON.parse(await adsk.fusionSendData("pick", "{}"));
  if (!reply.ok) return say(reply.message, true);
  cylinder = reply;
  fusionMaps = {};
  $("target").textContent = `${reply.body}: ${reply.bore ? "bore" : "cylinder"} ` +
    `Ø${(2 * reply.radiusMm).toFixed(2)} mm, ${reply.lengthMm.toFixed(1)} mm long`;
  $("target").classList.add("set");
  say("");
  enqueue("preview");
};

$("generate").onclick = () => enqueue("generate");
$("wholeBody").addEventListener("change", () => { if ($("live").checked) enqueue("preview"); });

$("live").addEventListener("change", () => {
  if ($("live").checked) enqueue("preview");
  else if (inFusion()) adsk.fusionSendData("hidePreview", "{}");
});

for (const tab of document.querySelectorAll("nav.tabs button")) {
  tab.onclick = () => {
    for (const t of document.querySelectorAll("nav.tabs button")) t.classList.toggle("on", t === tab);
    for (const s of document.querySelectorAll("section[data-tab]")) s.classList.toggle("hidden", s.dataset.tab !== tab.dataset.tab);
    if (tab.dataset.tab === "shape" && blocks[current].map && !blocks[current].map.exact) drawProfile(blockParams(blocks[current]), blocks[current].map);
  };
}

for (const b of $("modeSeg").children) {
  b.onclick = () => {
    mode = b.dataset.value;
    if (mode === "exact") {
      if (!EXACT_STYLES.includes($("style").value)) $("style").value = "sunk";
      if ($("panelShape").value === "hug") $("panelShape").value = "rounded";
    }
    showRelevant();
    schedule();
  };
}

function applyPreset() {
  const preset = PRESETS[$("preset").value];
  if (!preset) return;
  for (const k of PROFILE_FIELDS) $(k).value = preset[k];
  showSliderValues();
}
$("preset").innerHTML = Object.entries(PRESETS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("") +
  `<option value="custom">Custom</option>`;
$("preset").addEventListener("change", () => { applyPreset(); schedule(); });
for (const k of PROFILE_FIELDS) $(k).addEventListener("input", () => { $("preset").value = "custom"; });

let timer = null;
function schedule() {
  showSliderValues();
  showRelevant();
  clearTimeout(timer);
  timer = setTimeout(() => { saveForm(); drawBlocks(); enqueue("preview"); }, 150);
}
for (const id of [...BLOCK_FIELDS, "rimFilletMm", "floorFilletMm"]) {
  // The font box redraws when a family is committed (see the font list below).
  if (id !== "family") $(id).addEventListener("input", schedule);
}

// ---------------------------------------------------------------------------
// The font list: every Google family, each shown in itself. A family's
// stylesheet is added once its row scrolls into view, through the same
// loader the text is drawn with, so a font picked here is already on its
// way. Only the first LIST_LIMIT matches are listed at once.
// ---------------------------------------------------------------------------

const familyBox = $("family"), fontList = $("fonts");
const LIST_LIMIT = 300;
let highlighted = -1;

const cssFamily = name => `'${name.replace(/['\\]/g, "")}', sans-serif`;

const fontRows = new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    const family = entry.target.dataset.family;
    googleStylesheet(family, 400);
    entry.target.firstChild.style.fontFamily = cssFamily(family);
    fontRows.unobserve(entry.target);
  }
}, { root: fontList, rootMargin: "150px" });

function showFonts(filter) {
  const typed = filter ? familyBox.value.trim().toLowerCase() : "";
  const kind = $("fontKind").value;
  const matches = GOOGLE_FONTS.filter(([name, k]) => (!kind || k === kind) && name.toLowerCase().includes(typed));
  // Names that start with what was typed come first.
  if (typed) matches.sort((a, b) => (b[0].toLowerCase().startsWith(typed) - a[0].toLowerCase().startsWith(typed)));
  fontRows.disconnect();
  fontList.innerHTML = "";
  for (const [family, k] of matches.slice(0, LIST_LIMIT)) {
    const item = document.createElement("li");
    item.dataset.family = family;
    const name = document.createElement("span");
    name.textContent = family;
    const tag = document.createElement("span");
    tag.className = "kind";
    tag.textContent = k.replace("-", " ");
    item.append(name, tag);
    fontList.append(item);
    fontRows.observe(item);
  }
  if (matches.length > LIST_LIMIT) {
    const more = document.createElement("li");
    more.className = "more";
    more.textContent = `${matches.length - LIST_LIMIT} more: type to narrow the list`;
    fontList.append(more);
  }
  highlighted = -1;
  fontList.hidden = matches.length === 0;
}

function highlight(index) {
  const items = [...fontList.children].filter(li => li.dataset.family);
  if (!items.length) return;
  highlighted = (index + items.length) % items.length;
  for (const [k, item] of items.entries()) item.classList.toggle("on", k === highlighted);
  items[highlighted].scrollIntoView({ block: "nearest" });
}

// The box shows its own font too, once that font is there.
function styleFamilyBox() { familyBox.style.fontFamily = cssFamily(familyBox.value.trim()); }

// Typing only filters the list. The text is redrawn once a family is picked,
// or typed and then confirmed with Enter or by leaving the box, so a
// half-typed name doesn't flash "not found".
let committed = familyBox.value;
function commitFont() {
  fontList.hidden = true;
  styleFamilyBox();
  if (familyBox.value !== committed) {
    committed = familyBox.value;
    schedule();
  }
}

function chooseFont(family) {
  familyBox.value = family;
  commitFont();
}

familyBox.addEventListener("focus", () => showFonts(false));
familyBox.addEventListener("click", () => { if (fontList.hidden) showFonts(false); });
familyBox.addEventListener("input", () => showFonts(true));
familyBox.addEventListener("blur", commitFont);
familyBox.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (fontList.hidden) showFonts(false);
    highlight(highlighted + (e.key === "ArrowDown" ? 1 : -1));
    e.preventDefault();
  } else if (e.key === "Enter") {
    if (!fontList.hidden && highlighted >= 0) chooseFont(fontList.children[highlighted].dataset.family);
    else commitFont();
    e.preventDefault();
  } else if (e.key === "Escape") {
    fontList.hidden = true;
  }
});
// mousedown rather than click, so it lands before the box loses focus.
fontList.addEventListener("mousedown", e => {
  const item = e.target.closest("li");
  if (item && item.dataset.family) chooseFont(item.dataset.family);
  e.preventDefault();
});
$("fontKind").addEventListener("change", () => { familyBox.focus(); showFonts(false); });
$("fontKind").addEventListener("mousedown", e => e.stopPropagation());

window.addEventListener("resize", () => { const b = blocks[current]; if (b && b.map) drawProfile(blockParams(b), b.map); });

applyPreset();
addBlock(readForm());
writeForm(blocks[0].params);
drawBlocks();
schedule();
</script>
</body>
</html>
